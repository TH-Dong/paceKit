name: pacekit
description: A lightweight planning app with daily plans, DDL memos, habit tracking, and pixel pet feedback.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.26
  path: ^1.9.0
  path_provider: ^2.1.5
  intl: ^0.20.2
  uuid: ^4.5.1
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: SmileySans
      fonts:
        - asset: assets/fonts/SmileySans-Oblique.ttf
    - family: LXGWWenKaiScreen
      fonts:
        - asset: assets/fonts/LXGWWenKaiScreen.ttf
  assets:
    - pet/leafbuds/
    - pet/leafbuds_transparent/
    - pet/Clouds/
    - pet/Clouds_transparent/
    - pet/Strawberry/
    - pet/Strawberry_transparent/
